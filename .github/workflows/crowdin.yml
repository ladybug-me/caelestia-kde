name: Crowdin

on:
  push:
    branches: [dev]
    paths:
      - "shell/**/*.qml"
      - "shell/translations/**"
      - "crowdin.yml"
      - ".github/workflows/crowdin.yml"
  workflow_dispatch:
    inputs:
      seed_translations:
        description: >-
          Also upload the committed catalogs. Needed once, on the very first
          run, and harmful afterwards -- see the workflow comments.
        type: boolean
        default: false

concurrency:
  group: crowdin
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    if: github.repository == 'ladybug-me/caelestia-kde'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Install Qt Linguist Tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev

      - name: Regenerate the Source Catalog
        run: |
          set -euo pipefail
          tools/update-translations.sh en
          test -s shell/translations/caelestia_en.ts

      - name: Synchronize with Crowdin
        uses: crowdin/github-action@v2
        with:
          upload_sources: true
          upload_translations: ${{ inputs.seed_translations == true }}
          auto_approve_imported: ${{ inputs.seed_translations == true }}
          download_translations: true
          skip_untranslated_files: true
          localization_branch_name: i18n/crowdin
          create_pull_request: true
          pull_request_title: "i18n: new translations from Crowdin"
          pull_request_body: |
            Translations downloaded from Crowdin.

            The compiled `.qm` catalogs are refreshed by the workflow on this
            branch, so this can be merged as it stands.
          commit_message: "i18n: new translations from Crowdin"
          config: crowdin.yml
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          CROWDIN_PROJECT_ID: ${{ secrets.CROWDIN_PROJECT_ID }}
          CROWDIN_PERSONAL_TOKEN: ${{ secrets.CROWDIN_PERSONAL_TOKEN }}

  compile:
    runs-on: ubuntu-latest
    if: github.repository == 'ladybug-me/caelestia-kde'
    permissions:
      contents: write
    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout Localization Branch
        uses: actions/checkout@v4
        with:
          ref: i18n/crowdin
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0
        continue-on-error: true
        id: checkout

      - name: Install Qt Linguist Tools
        if: steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y qt6-l10n-tools qt6-tools-dev

      - name: Recompile Catalogs
        if: steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          shopt -s nullglob
          lrelease=/usr/lib/qt6/bin/lrelease
          [[ -x "$lrelease" ]] || lrelease=$(command -v lrelease)

          for ts in shell/translations/caelestia_*.ts; do
            "$lrelease" -silent "$ts" -qm "${ts%.ts}.qm"
          done

      - name: Commit Compiled Catalogs
        if: steps.checkout.outcome == 'success'
        run: |
          set -euo pipefail
          if git diff --quiet -- shell/translations; then
            echo "Catalogs already match their sources."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add shell/translations
          git commit -m "i18n: recompile catalogs"
          git push
    needs: synchronize
