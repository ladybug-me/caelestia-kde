name: Version Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: version-release
  cancel-in-progress: true

jobs:
  version-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch main Branch
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main --force

      - name: Load Version from Config
        run: |
          set -euo pipefail
          source .github/version.env

          if [[ -z "${VERSION:-}" ]]; then
            echo "VERSION is missing in .github/version.env"
            exit 1
          fi

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must match vX.Y.Z, got: $VERSION"
            exit 1
          fi

          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Validate Version Sync (Release-Only)
        run: |
          set -euo pipefail

          ABOUT_BINDING=$(grep -F 'text: CUtils.version ? `v${CUtils.version}` : "…"' shell/modules/nexus/pages/AboutPage.qml | head -n 1 || true)

          echo "Config VERSION: $VERSION"
          echo "About binding:  ${ABOUT_BINDING:-<missing>}"

          if [[ -z "${ABOUT_BINDING:-}" ]]; then
            echo "Version validation failed. Ensure AboutPage reads CUtils.version before release."
            exit 1
          fi

      - name: Create or Update Version Tag
        run: |
          set -euo pipefail

          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)

          echo "LAST_TAG=$LAST_TAG" >> $GITHUB_ENV

          git tag -f "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION" --force

      - name: Create or Update Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          if [ -n "$LAST_TAG" ] && [ "$LAST_TAG" != "$VERSION" ]; then
            git fetch origin dev:refs/remotes/origin/dev --force || true

            SYNC_COMMIT=$(git rev-list "$LAST_TAG..origin/dev" --ancestry-path --merges | tail -n 1 || true)

            if [ -n "$SYNC_COMMIT" ]; then
              git log "$SYNC_COMMIT..origin/dev" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
            else
              git log "$LAST_TAG..$GITHUB_SHA" --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
            fi
          else
            git log origin/main -n 15 --no-merges --invert-grep --grep='\[skip ci\]' --pretty='- %s (%h)' > commit_notes.txt
          fi

          {
            echo "### What's New in $VERSION"
            echo

            if [ -s commit_notes.txt ]; then
              if grep -qiE '^- (major)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Major Changes"
                grep -iE '^- (major)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (major)\(([^)]*)\): /- \2: /i; s/^- (major): /- /i'
                echo
              fi

              if grep -qiE '^- (feat|feature)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Features"
                grep -iE '^- (feat|feature)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (feat|feature)\(([^)]*)\): /- \2: /i; s/^- (feat|feature): /- /i'
                echo
              fi

              if grep -qiE '^- (perf|performance)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Performance"
                grep -iE '^- (perf|performance)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (perf|performance)\(([^)]*)\): /- \2: /i; s/^- (perf|performance): /- /i'
                echo
              fi

              if grep -qiE '^- (fix|bug)(\([^)]*\))?:' commit_notes.txt; then
                echo "#### Bug Fixes"
                grep -iE '^- (fix|bug)(\([^)]*\))?:' commit_notes.txt | sed -E 's/^- (fix|bug)\(([^)]*)\): /- \2: /i; s/^- (fix|bug): /- /i'
                echo
              fi
            else
              echo "- Maintenance release for $VERSION."
            fi
          } > release_notes.md

          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release edit "$VERSION" \
              --title "Caelestia $VERSION" \
              --notes-file release_notes.md \
              --prerelease=false \
              --latest
          else
            gh release create "$VERSION" \
              --title "Caelestia $VERSION" \
              --notes-file release_notes.md \
              --prerelease=false \
              --latest
          fi

      - name: Open Sync PR to dev
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail

          echo "Attempting to open a PR to sync main into dev..."

          gh pr create \
            --base dev \
            --head main \
            --title "chore: sync main back to dev after $VERSION" \
            --body "This is an automated PR to sync the new release tags from \`main\` back into \`dev\`." || true

  build-shell:
    name: Precompile shell artifacts (x86_64)
    needs: version-release
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      http_proxy: http://127.0.0.1:9
      https_proxy: http://127.0.0.1:9
      all_proxy: http://127.0.0.1:9
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Shell Build Dependencies
        uses: ./.github/actions/install-build-deps
        with:
          extra-packages: github-cli meson autoconf-archive

      - name: Install Prebuilt CAVA SDK (Arch)
        run: |
          set -euo pipefail
          source scripts/lib/toolchain.sh
          install_cava_sdk arch

      - name: Prepare Pinned Build Dependencies
        run: |
          set -euo pipefail
          rm -rf build/shell-release
          rm -rf "${XDG_CACHE_HOME:-$HOME/.cache}/caelestia-kde"
          bash scripts/fetch-dependencies.sh

      - name: Load Release Tag
        run: |
          set -euo pipefail
          source .github/version.env
          echo "TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Configure Shell
        run: |
          set -euo pipefail
          cd shell && cmake --preset release

      - name: Build Shell
        run: |
          set -euo pipefail
          cd shell && cmake --build --preset release -j"$(nproc)"

      - name: Stage Compiled Artifacts
        run: |
          set -euo pipefail
          QT_ABI="$(pkg-config --modversion Qt6Core | grep -oE '^[0-9]+\.[0-9]+')"
          DESTDIR="$PWD/stage" cmake --install build/shell-release
          mkdir -p dist/root/bin dist/root/lib/qt6/qml dist/root/lib/caelestia dist/root/quickshell
          cp -a stage/usr/bin/. dist/root/bin/
          cp -a stage/usr/lib/qt6/qml/Caelestia stage/usr/lib/qt6/qml/M3Shapes dist/root/lib/qt6/qml/
          cp -a stage/usr/lib/caelestia/. dist/root/lib/caelestia/
          cp -a stage/usr/etc/xdg/quickshell/caelestia dist/root/quickshell/
          ARTIFACT="dist/caelestia-kde-x86_64-qt${QT_ABI}.tar.gz"
          tar -C dist/root -czf "$ARTIFACT" bin lib quickshell
          python3 .github/scripts/check_release_archive.py "$ARTIFACT" dist/root
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"
          CHECKSUM="${ARTIFACT}.sha256"
          sha256sum "$ARTIFACT" | sed "s|$(dirname "$ARTIFACT")/||" > "$CHECKSUM"
          echo "CHECKSUM=$CHECKSUM" >> "$GITHUB_ENV"

      - name: Attach Shell Artifacts to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # --repo: inside a container gh's git-based repo detection fails ("not a git
          gh release upload "$TAG" "$ARTIFACT" "$CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber

  build-source:
    name: Build AUR source tarball
    needs: version-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Materialize the Submodules the Tarball Inlines
        run: |
          set -euo pipefail
          if [ ! -f .gitmodules ]; then
            echo "::error::no .gitmodules; the submodules the tarball inlines cannot be resolved"
            exit 1
          fi

          mapfile -t submodules < <(
            git config -f .gitmodules --get-regexp '^submodule\..*\.path$' | cut -d' ' -f2-
          )
          if [ "${#submodules[@]}" -eq 0 ]; then
            echo "::error::.gitmodules declares no submodules; the tarball would carry none"
            exit 1
          fi

          for path in "${submodules[@]}"; do
            echo "::group::submodule $path"
            # A .gitmodules entry with no gitlink in this tree has nothing to inline:
            # the path is either a real directory the tarball already carries or it is
            # absent, which the PKGBUILD's prepare() reports by name.
            if ! git ls-files --stage -- "$path" | grep -q '^160000'; then
              echo "::warning::$path is declared in .gitmodules but is not a submodule in this tree"
              echo "::endgroup::"
              continue
            fi
            # scripts/lib/submodules.sh is not reused here on purpose: the installer
            # helper it exposes ends in a plain clone of the submodule's default
            # branch, and a release tarball has to carry the commits the tag pins.
            if ! git submodule update --init --recursive --depth 1 --force "$path"; then
              # A stale gitlink inside a submodule is not this repository's to fix, and
              # the tarball only needs the submodule's own contents at its pinned commit.
              echo "::warning::$path does not check out recursively, retrying without it"
              git submodule update --init --depth 1 --force "$path"
            fi
            if [ -z "$(ls -A "$path")" ]; then
              echo "::error::submodule $path is empty; the PKGBUILD refuses a tarball without it"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Load Release Tag
        run: |
          set -euo pipefail
          source .github/version.env
          echo "TAG=$VERSION" >> "$GITHUB_ENV"
          echo "PKGVER=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Stage the Tree
        run: |
          set -euo pipefail
          ROOT="caelestia-kde-$PKGVER"
          mkdir -p "dist/$ROOT"
          # /dist is anchored: the staging directory lives inside the tree being
          # staged, and without this rsync copies it into itself.
          rsync -a --exclude '/dist' --exclude '.git' --exclude '.gitmodules' ./ "dist/$ROOT/"
          git rev-parse HEAD > "dist/$ROOT/REVISION"

      - name: Build the Tarball
        run: |
          set -euo pipefail
          ARTIFACT="caelestia-kde-v$PKGVER.tar.gz"
          tar -C dist -czf "$ARTIFACT" "caelestia-kde-$PKGVER"
          sha256sum "$ARTIFACT" | tee "$ARTIFACT.sha256"
          du -h "$ARTIFACT"
          {
            echo "### $ARTIFACT"
            echo "```"
            cat "$ARTIFACT.sha256"
            echo "```"
            echo "First entry of the PKGBUILD's \`sha256sums\` array."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "ARTIFACT=$ARTIFACT" >> "$GITHUB_ENV"

      - name: Attach to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$ARTIFACT" "$ARTIFACT.sha256" \
            --repo "$GITHUB_REPOSITORY" --clobber

  build-installer:
    name: Build installer TUI (${{ matrix.arch }})
    needs: version-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Build Dependencies
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake g++ make

      - name: Load Release Tag
        run: |
          set -euo pipefail
          source .github/version.env
          echo "TAG=$VERSION" >> "$GITHUB_ENV"

      - name: Build Installer TUI
        run: |
          set -euo pipefail
          cmake -B installer/build -DCMAKE_BUILD_TYPE=Release installer/tui
          cmake --build installer/build -- -j"$(nproc)"

      - name: Attach Prebuilt Installer to Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TUI_VERSION="$(tr -d '[:space:]' < installer/data/tui.version)"
          BINARY="caelestia-install-${{ matrix.arch }}-v${TUI_VERSION}"
          cp installer/build/caelestia-install "$BINARY"
          sha256sum "$BINARY" > "$BINARY.sha256"
          gh release upload "$TAG" "$BINARY" "$BINARY.sha256" --repo "$GITHUB_REPOSITORY" --clobber
