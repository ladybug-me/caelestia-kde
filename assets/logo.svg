<?xml version="1.0" encoding="UTF-8"?>
<svg
    xmlns="http://www.w3.org/2000/svg"
    viewBox="0 0 128 128"
    width="128"
    height="128">

    <defs>
        <!-- Filter for white swoosh shadow on dark background -->
        <filter id="whiteShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.55" />
        </filter>

        <!-- Filter for teal swoosh shadow on white swoosh -->
        <filter id="tealShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#000000" flood-opacity="0.4" />
        </filter>

        <!-- Filter for KDE badge shadow -->
        <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
            <feDropShadow dx="0" dy="2.5" stdDeviation="3" flood-color="#000000" flood-opacity="0.6" />
        </filter>

        <!-- Vibrant teal gradient for upper swoosh -->
        <linearGradient id="tealGrad" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#4ea8a4" />
            <stop offset="50%" stop-color="#5ec5be" />
            <stop offset="100%" stop-color="#7feae1" />
        </linearGradient>

        <!-- Crisp white gradient for lower swoosh -->
        <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" stop-color="#ffffff" />
            <stop offset="100%" stop-color="#f0f3f6" />
        </linearGradient>

        <!-- Stars cyan gradient -->
        <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#8bf4ec" />
            <stop offset="100%" stop-color="#55c1b9" />
        </linearGradient>

        <!-- KDE Plasma Blue gradient -->
        <linearGradient id="kdeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#4faae8" />
            <stop offset="50%" stop-color="#3188d3" />
            <stop offset="100%" stop-color="#1c66b8" />
        </linearGradient>
    </defs>

    <!-- Caelestia Logo Elements -->
    <g transform="matrix(0.072000,0,0,0.072000,12.4509,18.9880)">
