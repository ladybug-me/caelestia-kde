[package]
name = "caelestia-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.0"
description = "The Caelestia installer TUI"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29.0"
libc = "0.2.190"
ratatui = "0.30.2"

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
