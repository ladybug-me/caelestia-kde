name: Install shell build dependencies
description: >-
  Install the Arch packages the shell build and its QML runtime expect. The
  packages are declared once in packaging/build-dependencies.json and read from
  there: a second copy here is what used to let one container job install a set
  that another job's build needed.

inputs:
  extra-packages:
    description: Space separated pacman packages that only the caller needs
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Read the build dependency manifest
      id: manifest
      shell: bash
      run: |
        set -euo pipefail
        if ! command -v python3 >/dev/null 2>&1; then
          pacman -Syu --noconfirm --needed python
        fi
        python3 - >> "$GITHUB_OUTPUT" <<'PY'
        import json
        import pathlib

        manifest = json.loads(
            pathlib.Path("packaging/build-dependencies.json").read_text(encoding="utf-8")
        )
        print("packages=" + " ".join(manifest["arch"]))
        PY

    - name: Install packages
      shell: bash
      run: |
        set -euo pipefail
        pacman -Syu --noconfirm --needed \
          ${{ steps.manifest.outputs.packages }} \
          ${{ inputs.extra-packages }}
