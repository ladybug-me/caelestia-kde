# ===================================================================
# 🎨 FOOT MATUGEN THEME 
# ===================================================================

[colors-{{ mode }}]
# Cursor Colors (Format: <text-color> <cursor-color>)
cursor={{colors.on_surface_variant.default.hex_stripped}} {{colors.on_surface.default.hex_stripped}}

# Base UI Colors
foreground={{colors.on_surface.default.hex_stripped}}
background={{colors.surface.default.hex_stripped}}
selection-foreground={{colors.on_secondary_container.default.hex_stripped}}
selection-background={{colors.secondary_container.default.hex_stripped}}
urls={{colors.primary.default.hex_stripped}}

# ===================================================================
# 16-COLOR TERMINAL PALETTE
# ===================================================================
# Normal colors
regular0={{colors.outline_variant.default.hex_stripped}}
regular1={{colors.error.default.hex_stripped}}
regular2={{colors.tertiary.default.hex_stripped}}
regular3={{colors.secondary.default.hex_stripped}}
regular4={{colors.primary.default.hex_stripped}}
regular5={{colors.tertiary.default.hex_stripped}}
regular6={{colors.on_primary_container.default.hex_stripped}}
regular7={{colors.on_surface.default.hex_stripped}}

# Bright colors
bright0={{colors.outline.default.hex_stripped}}
bright1={{colors.on_error_container.default.hex_stripped}}
bright2={{colors.on_tertiary_container.default.hex_stripped}}
bright3={{colors.on_secondary_container.default.hex_stripped}}
bright4={{colors.on_primary_container.default.hex_stripped}}
bright5={{colors.on_tertiary_container.default.hex_stripped}}
bright6={{colors.on_secondary_container.default.hex_stripped}}
bright7={{colors.on_surface_variant.default.hex_stripped}}
