name: Feature request
description: Got an idea? We'd love to hear it
labels: ["feature"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea!

        A quick search of [existing requests](https://github.com/caelestia-kde/caelestia/issues?q=is%3Aissue+label%3Afeature) avoids duplicates - if you find one, give it a thumbs up instead.

  - type: textarea
    attributes:
      label: What's the idea?
      description: Describe what you'd like to see. Mockups, screenshots, or examples from other projects all help.
      placeholder: A widget that shows the current weather in the top bar.
    validations:
      required: true

  - type: textarea
    attributes:
      label: Why would it be useful?
      description: What problem does it solve, or what workflow does it improve?
      placeholder: I check the weather frequently and hate pulling out my phone.
    validations:
      required: false
