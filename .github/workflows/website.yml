name: Website

on:
  push:
    branches: ["main", "dev"]
    paths:
      - "website/**"
      # The site reads these: the docs loader takes its pages out of them, and
      # the palette and asset steps take the schemes, logo and screenshots.
      - "README.md"
      - "docs/**"
      - ".github/CONTRIBUTING.md"
      - "assets/**"
      - "shell/assets/google-sans-flex/**"
      - "src/schemes/**"
      - ".github/workflows/website.yml"
  pull_request:
    branches: ["**"]
    paths:
      - "website/**"
      - "README.md"
      - "docs/**"
      - ".github/CONTRIBUTING.md"
      - "assets/**"
      - "shell/assets/google-sans-flex/**"
      - "src/schemes/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: website
        run: npm ci

      - name: Check types, formatting and lint
        working-directory: website
        run: npm run check

      - name: Unit tests
        working-directory: website
        run: npm run test:unit

      - name: Lint the markdown
        working-directory: website
        run: npm run lint:docs

      - name: Build the site
        working-directory: website
        run: npm run build

      - name: Install the browser for the gesture tests
        working-directory: website
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        working-directory: website
        run: npm run test:e2e

      - name: Upload the built site
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    # Only a push to main publishes. Pages has to be switched to GitHub Actions
    # as its source once, in the repository's settings.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
