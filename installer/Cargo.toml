[package]
name = "caelestia-install"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
description = "The Caelestia installer TUI"
license = "MIT"
publish = false

[dependencies]
crossterm = "0.29.0"
libc = "0.2.190"
# No `all-widgets`: the calendar widget is the only thing that pulls in `time`, and a calendar is
# not part of an installer.
ratatui = { version = "0.30.2", default-features = false, features = [
    "crossterm",
    "layout-cache",
    "underline-color",
] }

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "unwind"
