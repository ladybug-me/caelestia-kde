        <!-- Accent Star Sparkle 3 (Small, above KDE badge) -->
        <path
            fill="url(#starGrad)"
            d="m1259.85,729.09c-2.11,11.28-9.63,35.23-35.8,39.95-.89.16-.89,1.4,0,1.56 26.17,4.72 33.7,28.66 35.81,39.95.16.88,1.42.88,1.59,0 2.11-11.28 9.63-35.23 35.8-39.95.89-.16.89-1.4,0-1.56-26.17-4.72-33.7-28.66-35.81-39.95-.16-.88-1.42-.88-1.59,0z" />
    </g>

